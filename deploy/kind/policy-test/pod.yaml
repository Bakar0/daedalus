apiVersion: v1
kind: Pod
metadata:
  name: ws-abc
  namespace: u-t
  labels: { daedalus.dev/user: t, daedalus.dev/workspace: abc }
  ownerReferences:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: ws-abc
      uid: 00000000-0000-4000-8000-000000000001
  annotations:
    dev.gvisor.spec.mount.shared.share: pod
    dev.gvisor.spec.mount.shared.type: tmpfs
    dev.gvisor.spec.mount.shared.options: rw,rprivate
spec:
  runtimeClassName: gvisor
  serviceAccountName: runner
  automountServiceAccountToken: false
  shareProcessNamespace: false
  securityContext:
    {
      runAsNonRoot: true,
      fsGroup: 2000,
      seccompProfile: { type: RuntimeDefault },
    }
  containers:
    - name: runner
      image: daedalus-runner:dev
      command: ["bun", "/opt/daedalus/runner.js"]
      securityContext:
        {
          runAsUser: 1000,
          runAsGroup: 1000,
          allowPrivilegeEscalation: false,
          readOnlyRootFilesystem: true,
          capabilities: { drop: [ALL] },
        }
      volumeMounts:
        - { name: state, mountPath: /var/lib/daedalus-runner }
        - { name: token, mountPath: /run/daedalus-token, readOnly: true }
        - { name: shared, mountPath: /run/daedalus-runner }
        - { name: runner-tmp, mountPath: /tmp }
    - name: session
      image: daedalus-runner:dev
      command: ["bun", "/opt/daedalus/sessiond.js"]
      securityContext:
        {
          runAsUser: 1001,
          runAsGroup: 1001,
          allowPrivilegeEscalation: false,
          readOnlyRootFilesystem: true,
          capabilities: { drop: [ALL] },
        }
      volumeMounts:
        - { name: workspace, mountPath: /workspace }
        - { name: cache, mountPath: /cache }
        - { name: shared, mountPath: /run/daedalus-runner }
        - { name: session-tmp, mountPath: /tmp }
  volumes:
    - { name: workspace, persistentVolumeClaim: { claimName: ws-abc } }
    - { name: state, persistentVolumeClaim: { claimName: ws-abc-state } }
    - { name: token, secret: { secretName: ws-abc-runner } }
    - { name: shared, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
    - { name: cache, emptyDir: { sizeLimit: 2Gi } }
    - { name: runner-tmp, emptyDir: { sizeLimit: 64Mi } }
    - { name: session-tmp, emptyDir: { sizeLimit: 1Gi } }
