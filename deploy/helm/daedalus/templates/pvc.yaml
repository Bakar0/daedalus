apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "daedalus.gatewayName" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daedalus.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.gateway.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gateway.storage.size }}
