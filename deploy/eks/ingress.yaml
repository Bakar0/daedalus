# An internet-facing ALB in front of the gateway's public port, made by the
# AWS Load Balancer Controller. Edit the lines marked EDIT, then:
#   kubectl apply -f deploy/eks/ingress.yaml
# The admin port is not here: it stays on 127.0.0.1 in the pod and is reached
# with kubectl port-forward only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daedalus-gateway
  namespace: daedalus
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Send traffic straight to the gateway pod's IP.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:111122223333:certificate/EDIT
    # https only. Macs refuse a gateway URL that is not https, so no port 80.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
    # Dev login hands a token to anyone who can reach the gateway. Keep the
    # ALB closed to everyone but you until OIDC (1b).
    alb.ingress.kubernetes.io/inbound-cidrs: 203.0.113.10/32 # EDIT
    # The Mac's link to a workspace is a WebSocket through the ALB. The ALB
    # closes a connection idle this long (default 60, most 4000).
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600,routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: daedalus.example.com # EDIT: the name on the certificate
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daedalus-gateway
                port:
                  number: 8080
