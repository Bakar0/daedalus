name: Release

# Pushing a tag v<version> that matches package.json builds the stable app
# for both Mac architectures, publishes a GitHub release with the DMGs and the
# update feed the app reads, and updates the Homebrew cask.
#
# A version with a prerelease suffix, such as v0.32.0-beta.1, is a beta. It
# builds the same app and publishes a GitHub prerelease, which
# releases/latest never points at, so the stable feed and the cask stay as
# they are. Its update files also replace the assets of the rolling `beta`
# prerelease, the fixed feed that apps with "Get beta updates" on read
# (BETA_FEED_URL in packages/core/src/services/app-updates.ts). See
# docs/releasing.md.
#
# Optional repository secrets:
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, MACOS_DEVELOPER_ID
#     A "Developer ID Application" certificate (base64 .p12), its password and
#     its full name. Without them the app is built unsigned.
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER
#     An App Store Connect API key (base64 .p8) for notarization. Used only
#     when the certificate is present.
#   APP_ID, APP_PRIVATE_KEY
#     The GitHub App that may push to Bakar0/homebrew-tap, as in the servant
#     release. Without them the cask is attached to the release but not pushed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      notarized: ${{ steps.signing.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Check the tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun node_modules/electrobun/bin/electrobun.cjs prepare

      - uses: actions/cache@v4
        with:
          path: build/tmux
          key: tmux-${{ matrix.arch }}-${{ hashFiles('scripts/build-tmux.ts') }}

      - name: Import the signing certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_DEVELOPER_ID" ]; then
            echo "No signing certificate; building unsigned."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "ELECTROBUN_DEVELOPER_ID=$MACOS_DEVELOPER_ID" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "ELECTROBUN_APPLEAPIKEYPATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "ELECTROBUN_APPLEAPIKEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "ELECTROBUN_APPLEAPIISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "No notarization key; the build is signed but not notarized."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      # Electrobun reads the previous release's update.json from the feed to
      # build a delta patch, so this must run before the new release exists.
      - run: bun run build:stable

      - name: Check the bundle needs nothing from Homebrew
        run: |
          bundle=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$bundle" artifacts/stable-macos-${{ matrix.arch }}-Daedalus.dmg
          test -d "$bundle/Daedalus.app"
          hdiutil detach "$bundle"
          app=$(mktemp -d)
          tar --zstd -xf artifacts/stable-macos-${{ matrix.arch }}-Daedalus.app.tar.zst -C "$app"
          contents="$app/Daedalus.app/Contents"
          "$contents/MacOS/tmux" -V
          "$contents/MacOS/bun" --version
          if otool -L "$contents/MacOS/tmux" | tail -n +2 | grep -v '/usr/lib/'; then
            echo "The bundled tmux links a library outside /usr/lib" >&2
            exit 1
          fi
          env -i HOME="$HOME" PATH=/usr/bin:/bin DAEDALUS_HOME="$RUNNER_TEMP/daedalus-home" \
            "$contents/MacOS/bun" "$contents/Resources/app/cli/daedal.js" doctor

      - uses: actions/upload-artifact@v4
        with:
          name: stable-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-15
    # Two tags pushed together would otherwise race on the beta feed.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tell a beta from a stable release
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The cask follows stable releases only; a beta leaves it alone.
      - name: Write the Homebrew cask
        if: steps.kind.outputs.prerelease == 'false'
        run: |
          bun run scripts/homebrew-cask.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --arm64 artifacts/stable-macos-arm64-Daedalus.dmg \
            ${{ needs.build.outputs.notarized == 'true' && '--notarized' || '' }} \
            --out artifacts/daedalus.rb

      # 0.31.0 was the last Intel build. Those apps still ask the feed for
      # stable-macos-x64-update.json, and the feed is whatever the newest
      # release holds, so a release without it answers them with a 404 every
      # time they check. 0.31.0's own file names a version no newer than the
      # one they run, so re-attaching it keeps them quiet.
      - name: Keep the Intel update feed answering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.31.0 \
            --pattern stable-macos-x64-update.json --dir artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          # A beta is a prerelease and never latest, so releases/latest and
          # the stable feed keep serving the last stable release. A stable
          # release leaves latest to GitHub, which picks the highest version.
          kind=()
          if [ "$PRERELEASE" = "true" ]; then
            kind=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Daedalus ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            ${kind[@]+"${kind[@]}"}

      # The beta feed is one prerelease tagged `beta` whose assets each beta
      # replaces, so its download URL never changes. The bundles and patches
      # go up first and update.json last: an app that reads the new
      # update.json then finds the bundle it names. Assets an older beta left,
      # such as its patches, are removed afterwards.
      - name: Update the beta feed
        if: steps.kind.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta \
              --title "Daedalus beta feed" \
              --notes "The update feed for Daedalus with Get beta updates on. Each beta replaces these files; the versioned prereleases hold the release notes." \
              --prerelease --latest=false \
              --target "$GITHUB_SHA"
          fi
          shopt -s nullglob
          feed=(artifacts/*.dmg artifacts/*.tar.zst artifacts/*.patch)
          gh release upload beta "${feed[@]}" --clobber
          gh release upload beta artifacts/*-update.json --clobber
          keep=$(for file in "${feed[@]}" artifacts/*-update.json; do basename "$file"; done)
          gh release view beta --json assets --jq '.assets[].name' | while read -r name; do
            if ! grep -qxF "$name" <<<"$keep"; then
              gh release delete-asset beta "$name" --yes
            fi
          done
          gh release edit beta --notes "The update feed for Daedalus with Get beta updates on. It now carries ${GITHUB_REF_NAME}; see that release for its notes."

      # The same GitHub App the servant release uses: a token that lasts an
      # hour and can write only to the tap.
      - name: Check for GitHub App credentials
        id: gate
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "A beta does not touch the Homebrew tap."
          elif [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_ID not set; the cask is attached to the release but not pushed to Bakar0/homebrew-tap."
          fi

      - name: Mint tap token
        if: steps.gate.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Bakar0
          repositories: homebrew-tap

      - name: Checkout the tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Bakar0/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Commit the cask
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          mkdir -p tap/Casks
          cp artifacts/daedalus.rb tap/Casks/daedalus.rb
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          cd tap
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Casks/daedalus.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "daedalus ${GITHUB_REF_NAME}"
            git push
          fi
